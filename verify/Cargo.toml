[package]
name = "sakra-verify"
version = "0.1.0"
edition = "2021"
description = "Zero-dependency offline receipt verifier for SÄKRA witness receipts"
license = "Apache-2.0"

[dependencies]
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
p256 = { version = "0.13", features = ["ecdsa", "pem"] }
ecdsa = { version = "0.16", features = ["der"] }
base64 = "0.21"
# WebAuthn needs explicit SHA-256 for the rpIdHash and clientDataJSON hash.
sha2 = "0.10"
